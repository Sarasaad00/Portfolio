<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
.th{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:16px;font-weight:600;fill:#f1f5f9;}
.ts{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:13px;fill:#94a3b8;}
.arr{stroke:#64748b;stroke-width:1.5;}
</style>

<rect x="180" y="40" width="320" height="56" rx="8" fill="rgba(71,85,105,0.16)" stroke="#64748b" stroke-width="1.5"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">Select job announcement</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">Open its applications</text>
<line x1="340" y1="96" x2="340" y2="156" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="156" width="320" height="56" rx="8" fill="rgba(59,130,246,0.14)" stroke="#3b82f6" stroke-width="1.5"/>
<text class="th" x="340" y="176" text-anchor="middle" dominant-baseline="central">Review submitted applications</text>
<text class="ts" x="340" y="194" text-anchor="middle" dominant-baseline="central">Select suitable candidates</text>
<line x1="340" y1="212" x2="340" y2="272" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="272" width="320" height="56" rx="8" fill="rgba(59,130,246,0.14)" stroke="#3b82f6" stroke-width="1.5"/>
<text class="th" x="340" y="292" text-anchor="middle" dominant-baseline="central">Approve initial acceptance</text>
<text class="ts" x="340" y="310" text-anchor="middle" dominant-baseline="central">Candidate moves forward</text>
<line x1="340" y1="328" x2="340" y2="388" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="388" width="320" height="56" rx="8" fill="rgba(20,184,166,0.14)" stroke="#14b8a6" stroke-width="1.5"/>
<text class="th" x="340" y="408" text-anchor="middle" dominant-baseline="central">Schedule test</text>
<text class="ts" x="340" y="426" text-anchor="middle" dominant-baseline="central">Set date and time</text>
<line x1="340" y1="444" x2="340" y2="504" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="504" width="320" height="56" rx="8" fill="rgba(34,197,94,0.14)" stroke="#22c55e" stroke-width="1.5"/>
<text class="th" x="340" y="524" text-anchor="middle" dominant-baseline="central">Candidate notified</text>
<text class="ts" x="340" y="542" text-anchor="middle" dominant-baseline="central">Test details become available</text>
</svg>
