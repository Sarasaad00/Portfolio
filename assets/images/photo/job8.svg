<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
.th{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:16px;font-weight:600;fill:#f1f5f9;}
.ts{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:13px;fill:#94a3b8;}
.arr{stroke:#64748b;stroke-width:1.5;}
</style>

<rect x="180" y="40" width="260" height="56" rx="8" fill="rgba(71,85,105,0.16)" stroke="#64748b" stroke-width="1.5"/>
<text class="th" x="310" y="60" text-anchor="middle" dominant-baseline="central">Test results reviewed</text>
<text class="ts" x="310" y="78" text-anchor="middle" dominant-baseline="central">Recruitment officer checks scores</text>
<line x1="310" y1="96" x2="310" y2="140" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="140" width="260" height="56" rx="8" fill="rgba(59,130,246,0.14)" stroke="#3b82f6" stroke-width="1.5"/>
<text class="th" x="310" y="160" text-anchor="middle" dominant-baseline="central">Moved to interview stage</text>
<text class="ts" x="310" y="178" text-anchor="middle" dominant-baseline="central">Successful test candidates</text>
<line x1="310" y1="196" x2="310" y2="240" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="240" width="260" height="56" rx="8" fill="rgba(59,130,246,0.14)" stroke="#3b82f6" stroke-width="1.5"/>
<text class="th" x="310" y="260" text-anchor="middle" dominant-baseline="central">Moved to acceptance stage</text>
<text class="ts" x="310" y="278" text-anchor="middle" dominant-baseline="central">Successful interview candidates</text>
<line x1="310" y1="296" x2="310" y2="340" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="340" width="260" height="56" rx="8" fill="rgba(34,197,94,0.14)" stroke="#22c55e" stroke-width="1.5"/>
<text class="th" x="310" y="360" text-anchor="middle" dominant-baseline="central">Final acceptance confirmed</text>
<text class="ts" x="310" y="378" text-anchor="middle" dominant-baseline="central">Candidate hired</text>

<path d="M440 268 L520 268" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<rect x="520" y="240" width="130" height="56" rx="8" fill="rgba(245,158,11,0.14)" stroke="#f59e0b" stroke-width="1.5"/>
<text class="th" x="585" y="260" text-anchor="middle" dominant-baseline="central">SMS notification</text>
<text class="ts" x="585" y="278" text-anchor="middle" dominant-baseline="central">Sent every stage</text>
