<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
.th{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:16px;font-weight:600;fill:#f1f5f9;}
.ts{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:13px;fill:#94a3b8;}
.arr{stroke:#64748b;stroke-width:1.5;}
</style>

<rect x="210" y="30" width="260" height="56" rx="8" fill="rgba(71,85,105,0.16)" stroke="#64748b" stroke-width="1.5"/>
<text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central">Request submitted</text>
<text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Enters the review queue</text>
<line x1="340" y1="86" x2="340" y2="130" class="arr" marker-end="url(#arrow)"/>

<rect x="210" y="130" width="260" height="56" rx="8" fill="rgba(59,130,246,0.14)" stroke="#3b82f6" stroke-width="1.5"/>
<text class="th" x="340" y="150" text-anchor="middle" dominant-baseline="central">Project manager approval</text>
<text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">First-level review</text>
<line x1="340" y1="186" x2="340" y2="230" class="arr" marker-end="url(#arrow)"/>

<rect x="210" y="230" width="260" height="56" rx="8" fill="rgba(59,130,246,0.14)" stroke="#3b82f6" stroke-width="1.5"/>
<text class="th" x="340" y="250" text-anchor="middle" dominant-baseline="central">Security review approval</text>
<text class="ts" x="340" y="268" text-anchor="middle" dominant-baseline="central">Second-level review</text>
<line x1="340" y1="286" x2="340" y2="330" class="arr" marker-end="url(#arrow)"/>

<rect x="210" y="330" width="260" height="56" rx="8" fill="rgba(59,130,246,0.14)" stroke="#3b82f6" stroke-width="1.5"/>
<text class="th" x="340" y="350" text-anchor="middle" dominant-baseline="central">Compliance &amp; audit approval</text>
<text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">Final review level</text>
<line x1="340" y1="386" x2="340" y2="420" class="arr" marker-end="url(#arrow)"/>

<rect x="210" y="420" width="260" height="56" rx="8" fill="rgba(34,197,94,0.14)" stroke="#22c55e" stroke-width="1.5"/>
<text class="th" x="340" y="440" text-anchor="middle" dominant-baseline="central">Permit issued</text>
<text class="ts" x="340" y="458" text-anchor="middle" dominant-baseline="central">Ready for optional printing</text>

<path d="M470 258 L560 258" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<rect x="560" y="230" width="110" height="56" rx="8" fill="rgba(239,68,68,0.14)" stroke="#ef4444" stroke-width="1.5"/>
<text class="th" x="615" y="250" text-anchor="middle" dominant-baseline="central">Rejected</text>
<text class="ts" x="615" y="268" text-anchor="middle" dominant-baseline="central">Process stops</text>
<text class="ts" x="615" y="310" text-anchor="middle">Any level may reject</text>
</svg>
